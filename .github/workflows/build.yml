name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk desk-clock.apk

      - uses: actions/upload-artifact@v4
        with:
          name: desk-clock-apk
          path: desk-clock.apk

      # main 分支的每次构建都发一个 Release；Release 里的文件不会过期
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: 桌面时钟 build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: desk-clock.apk
          make_latest: true
